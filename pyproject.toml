[project]
name = "mcp-secure-gateway"
version = "0.1.0"
description = "Zero-Trust MCP Tool Server (File · Database · Web)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.0,<5.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlglot>=25.0,<26.0",
    "structlog>=24.0,<25.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<11.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.24,<2.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "pip-audit>=2.7,<3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "T20",   # ban print()
    "ASYNC", # async checks
    "S",     # bandit security rules
    "RUF",   # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# assert is standard in pytest test suites
"tests/*" = ["S101", "B017", "SIM117"]
# sample data seeding scripts are permitted to print CLI completion status
"sample_data/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unreachable = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --cov=app --cov-branch --cov-fail-under=80"
markers = ["security: automated security penetration tests"]

[tool.coverage.run]
branch = true
source = ["app"]
